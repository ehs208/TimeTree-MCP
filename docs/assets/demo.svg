<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Example: asking an AI assistant about this week's family calendar through TimeTree MCP</title>
  <rect width="880" height="440" rx="20" fill="#F5F6F8"/>
  <!-- user message -->
  <rect x="300" y="32" width="548" height="60" rx="16" fill="#1F2A44"/>
  <text x="324" y="68" font-size="17" fill="#F5F6F8">Summarize our family calendar this week. Any conflicts?</text>
  <!-- tool call chip -->
  <rect x="32" y="116" width="292" height="32" rx="16" fill="#E8ECF3"/>
  <circle cx="52" cy="132" r="6" fill="#4C7CF0"/>
  <text x="66" y="137" font-size="14" fill="#4A5468" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">timetree: get_events</text>
  <!-- assistant answer -->
  <rect x="32" y="164" width="660" height="244" rx="16" fill="#FFFFFF" stroke="#DDE2EA"/>
  <text x="56" y="200" font-size="17" fill="#1F2A44" font-weight="600">This week: 4 events on the Family calendar</text>
  <g font-size="16" fill="#2E3440">
    <text x="56" y="236">Mon  18:30  Swimming lesson</text>
    <text x="56" y="264">Wed  09:00  Dentist (Mina)</text>
    <text x="56" y="292">Sat  11:00  Soccer match</text>
    <text x="56" y="320">Sat  12:00  Lunch with grandparents</text>
  </g>
  <rect x="56" y="340" width="612" height="44" rx="10" fill="#FDECEC"/>
  <text x="72" y="368" font-size="16" fill="#B42318">Conflict on Saturday: the match runs until 12:30, lunch starts at 12:00.</text>
</svg>

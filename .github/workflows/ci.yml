name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Catch newly published advisories on main before they block unrelated PRs.
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # Report every Node version instead of cancelling siblings on the first failure.
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Audit dependencies (high and above)
        run: npm audit --audit-level=high
